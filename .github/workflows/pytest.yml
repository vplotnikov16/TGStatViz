name: Pytest

on:
  - push

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10" ]

    steps:
      - uses: actions/checkout@v4

      - name: Установка Python и Poetry
        uses: ./.github/actions/setup-venv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with pytest
        run: |
          poetry run pytest
