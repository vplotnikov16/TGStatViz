# Пример конфигурации раскадровки для генерации видео статистики чата

project:
  title: "Статистика чата: пример раскадровки"
  description: "Демонстрационная раскадровка с базовыми метриками личного чата"

defaults:
  style: "dark"
  transition:
    name: "fade"
    duration: 0.5

slides:
  # Слайд 1: Накопительное количество сообщений по дням
  - metric: "personal.cumulative_messages"
    renderer: "animated_line_chart"
    duration: 6
    params:
      smooth_window: 7

  # Слайд 2: Количество сообщений по дням
  - metric: "personal.daily_messages"
    renderer: "animated_line_chart"
    duration: 6
    params:
      smooth_window: 7